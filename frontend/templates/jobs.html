<!-- Jobs page html code, since we are using the tab style, we need a html page for each tab -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs | LinkedOut</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='jobs.css') }}">
</head>
<body>
    <header class="jobsHeader">
        <div class="headerInner">
            <a href="/home" class="logo">LinkedOut</a>
            <nav class="navLinks">
                <a href="/home">Home</a>
                <a href="/jobs-page" class="active">Jobs</a>
                <a href="/profile-page">Profile</a>
            </nav>
        </div>
    </header>
 
    <main class="jobsMain">
        <section class="jobsIntro">
            <h1>Find your next role</h1>
            <p>Live job listings powered by The Muse.</p>
        </section>

        <!-- Since our api supports filtering using categories, I wanted to make the ability to search for jobs easier and faster, by giving users the ability to filter jobs. -->
        <section class="searchBar">
            <input type="text" id="categoryInput" placeholder="Category (e.g. Software Engineering)">
            <input type="text" id="locationInput" placeholder="Location (e.g. New York, NY)">
            <input type="text" id="levelInput" placeholder="Level (e.g. Entry Level)">
            <button id="searchBtn">Search</button>
        </section>
 
        <section id="statusArea" class="statusArea"></section>
      
         <!-- Since we decides to use an API and get real life time jobs into our web app, this is hwere the jobs from the api will get injected. -->
        <section id="jobsList" class="jobsList"></section>
 
        <div class="loadMoreWrap">
            <button id="loadMoreBtn" class="loadMoreBtn" style="display:none;">Load more jobs</button>
        </div>
    </main>
 
    <script src="{{ url_for('static', filename='jobs.js') }}"></script>
</body>
</html>
